name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host:
    name: Linux simulator and sequencer
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl2-dev libcairo2-dev libjson-c-dev libasound2-dev libfontconfig1-dev
      - name: Test and build
        run: make check
      - name: Check memory safety
        run: make test-sanitize
      - name: Check alternate CC assignment
        run: make check SEQUENCE_CC=12
